<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indel Bioinnovations</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white overflow-hidden">

  <!-- Background -->
  <div class="fixed inset-0 -z-30 bg-[radial-gradient(circle_at_top_left,rgba(113,192,231,0.18),transparent_24%),radial-gradient(circle_at_85%_10%,rgba(82,117,182,0.20),transparent_24%),radial-gradient(circle_at_50%_70%,rgba(59,130,246,0.08),transparent_24%),linear-gradient(180deg,#060d18_0%,#091220_38%,#0a1320_100%)]"></div>
  <div class="fixed inset-0 -z-20 opacity-[0.08] [background-image:linear-gradient(rgba(255,255,255,0.12)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.12)_1px,transparent_1px)] [background-size:72px_72px]"></div>
  <div class="fixed inset-x-0 top-0 -z-10 h-[520px] bg-[radial-gradient(circle_at_top,rgba(113,192,231,0.12),transparent_60%)]"></div>

  <main class="flex min-h-screen items-center justify-center px-6">
    <div class="w-full max-w-3xl rounded-[32px] border border-white/10 bg-white/[0.04] p-10 text-center shadow-[0_30px_90px_rgba(0,0,0,0.28)] backdrop-blur-xl">

      <div class="mb-8 flex items-center justify-center gap-4">
        <img src="Indel Logo.png" alt="Indel logo" class="h-16 w-auto rounded-md" />
      </div>

      <div class="text-sm font-semibold uppercase tracking-[0.28em] text-[rgb(113,192,231)]">
        Indel Bioinnovations
      </div>

      <h1 class="mt-6 text-4xl font-semibold tracking-tight text-white sm:text-5xl">
        Full website preview available on request
      </h1>

      <p class="mt-6 text-lg leading-8 text-slate-300">
        Reach out to view the current test version of the Indel Bioinnovations website.
      </p>

      <div class="mt-10">
        <a
          href="mailto:contact@indelbioinnovations.com?subject=Website%20Preview%20Request"
          class="inline-flex rounded-2xl bg-[rgb(82,117,182)] px-6 py-3.5 text-sm font-semibold text-white shadow-[0_14px_35px_rgba(82,117,182,0.35)] transition hover:scale-[1.01] hover:bg-[rgb(74,107,169)]"
        >
          Request access
        </a>
      </div>

    </div>
  </main>

</body>
</html>
